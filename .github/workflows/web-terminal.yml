name: Web Terminal

on:
  workflow_dispatch:
    inputs:

      runner:
        description: "Runner label (see runners/README.md for usable labels and specs)"
        required: true
        default: ubuntu-latest
        type: string


      duration:
        description: "Keep alive duration (minutes)"
        required: true
        default: "30"
        type: string


jobs:

  check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: runners

      - name: Check runner label
        shell: bash
        env:
          LABEL: ${{ inputs.runner }}
        run: |
          FILE=runners/runners.json
          if [[ ! -f "$FILE" ]]; then
            echo "::warning::$FILE not found, run Check Runners first. Skipping check."
            exit 0
          fi

          echo "Runner list checked at: $(jq -r .updated_at "$FILE")"

          if ! jq -e --arg l "$LABEL" '.web_terminal_labels | index($l)' "$FILE" >/dev/null; then
            echo "::error::'$LABEL' is not a usable Web Terminal runner."
            echo "Usable labels:"
            jq -r '.web_terminal_labels[] | "  - " + .' "$FILE"
            exit 1
          fi

          SPEC=$(jq -r --arg l "$LABEL" '.runners[] | select(.label == $l) |
            "Label:  \(.label)\nOS:     \(.os) (\(.arch))\nCPU:    \(.cpu_model) x\(.cpu_count)\nMemory: \(.memory_gb) GB\nDisk:   \(.disk_free_gb)/\(.disk_total_gb) GB free\nImage:  \(.image_version)"
          ' "$FILE")
          echo "$SPEC"
          printf '```\n%s\n```\n' "$SPEC" >> "$GITHUB_STEP_SUMMARY"


  runner:

    needs: check

    runs-on: ${{ inputs.runner }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: System Info
        shell: bash
        run: |
          echo "================================"
          echo "Runner Information"
          echo "================================"

          echo "OS: $RUNNER_OS"
          echo ""

          echo "Kernel:"
          uname -a

          echo ""

          echo "Architecture:"
          uname -m


          echo ""

          echo "CPU:"

          if [[ "$RUNNER_OS" == "Linux" ]]; then

              lscpu | grep -E "Model name|CPU\\(s\\)" || true


          elif [[ "$RUNNER_OS" == "macOS" ]]; then

              sysctl -n machdep.cpu.brand_string

          fi


          echo ""

          echo "Memory:"

          if [[ "$RUNNER_OS" == "Linux" ]]; then

              free -h


          elif [[ "$RUNNER_OS" == "macOS" ]]; then

              TOTAL=$(sysctl -n hw.memsize)

              echo "Total Memory: $((TOTAL / 1024 / 1024)) MB"

          fi


          echo ""

          echo "Disk:"

          df -h /


          echo ""

          echo "GPU:"

          if command -v nvidia-smi >/dev/null 2>&1; then

              nvidia-smi

          else

              echo "No NVIDIA GPU detected"

          fi



      - name: Start Web Terminal
        shell: bash
        run: |

          case "$RUNNER_OS" in

            Linux)

              bash scripts/linux.sh

              ;;


            macOS)

              bash scripts/macos.sh

              ;;


            *)

              echo "Unsupported OS: $RUNNER_OS"
              exit 1

              ;;

          esac



      - name: Keep Alive
        shell: bash
        run: |

          MINUTES=${{ inputs.duration }}

          echo "Keep alive: $MINUTES minutes"


          sleep $((MINUTES * 60))


          echo "Finished"