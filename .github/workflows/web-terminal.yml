name: Web Terminal

on:
  workflow_dispatch:
    inputs:

      runner:
        description: "Select runner (list is synced from .github/runners.json by Check Runners)"
        required: true
        type: choice
        # runners:begin (generated by check-runners, do not edit by hand)
        options:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - xcode-27
          - macos-26-intel
          - macos-latest
          - macos-26
          - macos-15-intel
          - macos-15
        default: ubuntu-latest
        # runners:end


      duration:
        description: "Keep alive duration (minutes)"
        required: true
        default: "30"
        type: string


jobs:

  runner:

    runs-on: ${{ inputs.runner }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Runner Spec
        shell: bash
        env:
          LABEL: ${{ inputs.runner }}
        run: |
          if [[ ! -f .github/runners.json ]]; then
            echo "::warning::.github/runners.json not found, run Check Runners first"
            exit 0
          fi
          jq -r --arg l "$LABEL" '
            "Checked at: \(.updated_at)",
            (.runners[] | select(.label == $l) |
              "Label: \(.label)\nOS: \(.os) (\(.arch))\nCPU: \(.cpu_model) x\(.cpu_count)\nMemory: \(.memory_gb) GB\nDisk: \(.disk_free_gb)/\(.disk_total_gb) GB free\nImage: \(.image_version)")
          ' .github/runners.json
          if ! jq -e --arg l "$LABEL" '.web_terminal_labels | index($l)' .github/runners.json >/dev/null; then
            echo "::warning::$LABEL is not in the last checked runner list"
          fi


      - name: System Info
        shell: bash
        run: |
          echo "================================"
          echo "Runner Information"
          echo "================================"

          echo "OS: $RUNNER_OS"
          echo ""

          echo "Kernel:"
          uname -a

          echo ""

          echo "Architecture:"
          uname -m


          echo ""

          echo "CPU:"

          if [[ "$RUNNER_OS" == "Linux" ]]; then

              lscpu | grep -E "Model name|CPU\\(s\\)" || true


          elif [[ "$RUNNER_OS" == "macOS" ]]; then

              sysctl -n machdep.cpu.brand_string

          fi


          echo ""

          echo "Memory:"

          if [[ "$RUNNER_OS" == "Linux" ]]; then

              free -h


          elif [[ "$RUNNER_OS" == "macOS" ]]; then

              TOTAL=$(sysctl -n hw.memsize)

              echo "Total Memory: $((TOTAL / 1024 / 1024)) MB"

          fi


          echo ""

          echo "Disk:"

          df -h /


          echo ""

          echo "GPU:"

          if command -v nvidia-smi >/dev/null 2>&1; then

              nvidia-smi

          else

              echo "No NVIDIA GPU detected"

          fi



      - name: Start Web Terminal
        shell: bash
        run: |

          case "$RUNNER_OS" in

            Linux)

              bash scripts/linux.sh

              ;;


            macOS)

              bash scripts/macos.sh

              ;;


            *)

              echo "Unsupported OS: $RUNNER_OS"
              exit 1

              ;;

          esac



      - name: Keep Alive
        shell: bash
        run: |

          MINUTES=${{ inputs.duration }}

          echo "Keep alive: $MINUTES minutes"


          sleep $((MINUTES * 60))


          echo "Finished"