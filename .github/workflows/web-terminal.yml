name: Web Terminal

on:
  workflow_dispatch:
    inputs:

      runner:
        description: "Select runner (synced by Check Runners)"
        required: true
        type: choice
        # runners:begin (generated by Check Runners, do not edit by hand)
        options:
          - ubuntu-26.04      # Ubuntu 26.04.1 LTS, x64, 4C, 15.6G RAM, 91.4G free, KVM
          - ubuntu-26.04-arm  # Ubuntu 26.04.1 LTS, arm64, 4C, 15.6G RAM, 111.3G free
          - ubuntu-latest     # Ubuntu 24.04.5 LTS, x64, 4C, 15.6G RAM, 86.0G free, KVM
          - ubuntu-24.04      # Ubuntu 24.04.5 LTS, x64, 4C, 15.6G RAM, 86.0G free, KVM
          - ubuntu-24.04-arm  # Ubuntu 24.04.5 LTS, arm64, 4C, 15.6G RAM, 107.8G free
          - ubuntu-22.04      # Ubuntu 22.04.5 LTS, x64, 4C, 15.6G RAM, 86.2G free, KVM
          - ubuntu-22.04-arm  # Ubuntu 22.04.5 LTS, arm64, 4C, 15.6G RAM, 110.5G free
          - xcode-27          # macOS 27.0, arm64, 3C, 7.0G RAM, 38.4G free
          - macos-26-intel    # macOS 26.6.1, x64, 4C, 14.0G RAM, 136.8G free
          - macos-latest      # macOS 26.6.2, arm64, 3C, 7.0G RAM, 95.6G free
          - macos-26          # macOS 26.6.2, arm64, 3C, 7.0G RAM, 95.5G free
          - macos-15-intel    # macOS 15.7.9, x64, 4C, 14.0G RAM, 108.0G free
          - macos-15          # macOS 15.7.9, arm64, 3C, 7.0G RAM, 42.8G free
        default: ubuntu-latest
        # runners:end


      duration:
        description: "Keep alive duration (minutes)"
        required: true
        default: "30"
        type: string


jobs:

  runner:

    runs-on: ${{ inputs.runner }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: System Info
        shell: bash
        run: |
          echo "================================"
          echo "Runner Information"
          echo "================================"

          echo "OS: $RUNNER_OS"
          echo ""

          echo "Kernel:"
          uname -a

          echo ""

          echo "Architecture:"
          uname -m


          echo ""

          echo "CPU:"

          if [[ "$RUNNER_OS" == "Linux" ]]; then

              lscpu | grep -E "Model name|CPU\\(s\\)" || true


          elif [[ "$RUNNER_OS" == "macOS" ]]; then

              sysctl -n machdep.cpu.brand_string

          fi


          echo ""

          echo "Memory:"

          if [[ "$RUNNER_OS" == "Linux" ]]; then

              free -h


          elif [[ "$RUNNER_OS" == "macOS" ]]; then

              TOTAL=$(sysctl -n hw.memsize)

              echo "Total Memory: $((TOTAL / 1024 / 1024)) MB"

          fi


          echo ""

          echo "Disk:"

          df -h /


          echo ""

          echo "GPU:"

          if command -v nvidia-smi >/dev/null 2>&1; then

              nvidia-smi

          else

              echo "No NVIDIA GPU detected"

          fi



      - name: Start Web Terminal
        shell: bash
        run: |

          case "$RUNNER_OS" in

            Linux)

              bash scripts/linux.sh

              ;;


            macOS)

              bash scripts/macos.sh

              ;;


            *)

              echo "Unsupported OS: $RUNNER_OS"
              exit 1

              ;;

          esac



      - name: Keep Alive
        shell: bash
        run: |

          MINUTES=${{ inputs.duration }}

          echo "Keep alive: $MINUTES minutes"


          sleep $((MINUTES * 60))


          echo "Finished"